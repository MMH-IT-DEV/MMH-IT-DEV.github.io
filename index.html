<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MMH FedEx Reporting</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #5d6570; --line: #e3e6ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111317; --card: #1a1d22; --text: #eef0f3; --muted: #9aa3ad; --line: #2b3038; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { font-size: 18px; margin: 0 0 8px; } p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>MMH FedEx Reporting</h1>
    <p>Sign-in page for the MMH FedEx reporting connector in Claude and ChatGPT. Open the connector from Claude or ChatGPT to sign in.</p>
  </main>
</body>
</html>
