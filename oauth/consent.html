<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MMH Shipping Reporting · Sign in</title>
  <style>
    /* Same window as the MMH Composio approval page (composio-team-test/consent/consent.html). */
    :root { --bg:#fff; --panel:#fcfdfc; --hdr:#f3f6f2; --line:#c9d3cc; --soft:#e3e9e4; --txt:#1b2b24; --dim:#5f7a6d; --faint:#8ba093;
            --green:#3f7a5f; --green-hi:#2e5f49; --green-dim:#619a80; --ga:rgba(63,122,95,.11); --red:#a4503f; --red-a:rgba(164,80,63,.10);
            --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--txt); font: 12px/1.5 var(--mono); }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--hdr); }
    .win { width: 100%; max-width: 480px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(27,43,36,.10); }
    .win-bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--hdr); border-bottom: 1px solid var(--line); }
    .win-bar b { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--green); font-weight: 600; }
    .win-bar::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(to right, var(--line) 0 4px, transparent 4px 7px); }
    main { padding: 18px 18px 20px; display: grid; gap: 14px; }
    .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
    .lbl::after { content: ""; flex: 1; height: 1px; background: var(--soft); }
    .kv { display: grid; grid-template-columns: 110px 1fr; border: 1px solid var(--line); background: var(--panel); }
    .kv span { padding: 7px 11px; border-bottom: 1px solid var(--soft); font-size: 11px; overflow-wrap: anywhere; }
    .kv .k { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); background: var(--hdr); border-right: 1px solid var(--soft); }
    .kv > :nth-last-child(-n+2) { border-bottom: 0; }
    label { display: grid; gap: 4px; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
    input { font: 12px var(--mono); padding: 7px 9px; border: 1px solid var(--line); background: #fff; color: var(--txt); }
    input:focus { outline: 1px solid var(--green-dim); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, a.btn { font: 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; padding: 7px 12px; border: 1px solid var(--line); background: transparent; color: var(--dim); cursor: pointer; text-decoration: none; }
    button.go, a.btn.go { color: var(--green-hi); border-color: var(--green-dim); background: var(--ga); }
    button:disabled { opacity: .5; cursor: default; }
    .msg { font-size: 11px; color: var(--dim); margin: 0; }
    .err { color: var(--red); background: var(--red-a); border: 1px solid #d9b3aa; padding: 8px 10px; font-size: 11px; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="win" role="dialog" aria-labelledby="ttl">
  <div class="win-bar"><b id="ttl">MMH Shipping Reporting</b></div>
  <main>
    <p class="msg" id="status">Loading…</p>

    <form id="pwForm">
      <div class="lbl">1 · Connector sign-in</div>
      <div style="display:grid;gap:8px;margin-top:8px">
        <input type="email" name="username" value="fedex-mcp@mymagichealer.com" autocomplete="username" hidden>
        <label for="pwInput">Team password<input id="pwInput" type="password" required autocomplete="current-password"></label>
        <div class="row"><button class="go" id="pwBtn" type="submit">Sign in</button></div>
      </div>
    </form>

    <section id="consent" hidden>
      <div class="lbl">2 · Request</div>
      <div class="kv" style="margin-top:8px">
        <span class="k">App</span><span id="client"></span>
        <span class="k">Returns to</span><span id="redirect"></span>
        <span class="k">Connector</span><span>FedEx + Canada Post (read-only)</span>
        <span class="k">Signed in</span><span id="who"></span>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="go" id="approve" type="button">Approve</button>
        <button id="deny" type="button">Deny</button>
      </div>
    </section>

    <section id="done" hidden>
      <div class="lbl">3 · Done</div>
      <p class="msg" id="done-msg" style="margin-top:8px"></p>
      <div class="row" style="margin-top:8px"><a class="btn go" id="continue" href="#">Continue</a></div>
    </section>

    <p class="err" id="error" hidden></p>
  </main>
</div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm";

    // Public by design: the project URL and its publishable key. All access control
    // happens server-side (OAuth 2.1 server, admin-created team account, MCP account check).
    const SUPABASE_URL = "https://trcejwpnezjuirkilssl.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_wIxzdARA-BurzFO78Ukgtw_Rj0QafKQ";
    const TEAM_EMAIL = "fedex-mcp@mymagichealer.com";   // the one shared account; people only type its password

    const $ = (id) => document.getElementById(id);
    const SECTIONS = ["pwForm", "consent", "done"];
    const show = (id) => { for (const s of SECTIONS) $(s).hidden = s !== id; $("status").hidden = true; };
    const status = (t) => { $("status").textContent = t; };
    const fail = (t) => { $("error").textContent = t; $("error").hidden = false; };
    // Look only: show step 3 while the browser goes back to the app.
    const done = (text, url) => { $("done-msg").textContent = text; $("continue").href = url; show("done"); };

    // Until a step is shown, nothing but the status line is visible.
    for (const s of SECTIONS) $(s).hidden = true;

    const supabase = createClient(SUPABASE_URL, PUBLISHABLE_KEY, {
      auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true },
    });

    const params = new URLSearchParams(location.search);
    const authorizationId = params.get("authorization_id");

    async function main() {
      if (!authorizationId) {
        status("");
        fail("No connection request. Open this page from the Connect button in Claude or ChatGPT.");
        return;
      }

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        show("pwForm");
        const back = `${location.origin}${location.pathname}?authorization_id=${encodeURIComponent(authorizationId)}`;
        $("pwInput").focus();
        $("pwForm").onsubmit = async (ev) => {
          ev.preventDefault();
          $("pwBtn").disabled = true;
          const { error } = await supabase.auth.signInWithPassword({ email: TEAM_EMAIL, password: $("pwInput").value });
          $("pwBtn").disabled = false;
          if (error) { fail(error.message === "Invalid login credentials" ? "Wrong password." : error.message); return; }
          location.replace(back);   // reload with the new session, then show the approve step
        };
        return;
      }

      if ((session.user?.email ?? "").toLowerCase() !== TEAM_EMAIL) {
        await supabase.auth.signOut();   // an old session from the email-code sign-in
        location.reload();
        return;
      }

      const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
      if (error) { status("Could not load the request"); fail(error.message); return; }
      if (data.redirect_url) { done("Already approved. Returning to the app…", data.redirect_url); location.replace(data.redirect_url); return; }

      $("client").textContent = data.client?.name || "Unnamed app";
      try { $("redirect").textContent = new URL(data.redirect_uri).host; } catch { $("redirect").textContent = data.redirect_uri; }
      $("who").textContent = session.user?.email ?? TEAM_EMAIL;
      show("consent");

      const decide = async (approve) => {
        $("approve").disabled = $("deny").disabled = true;
        const fn = approve ? supabase.auth.oauth.approveAuthorization : supabase.auth.oauth.denyAuthorization;
        const { data: r, error: e } = await fn.call(supabase.auth.oauth, authorizationId, { skipBrowserRedirect: true });
        if (e) { $("approve").disabled = $("deny").disabled = false; fail(e.message); return; }
        done(approve ? "Approved. Returning to the app…" : "Denied. Returning to the app…", r.redirect_url);
        location.replace(r.redirect_url);
      };
      $("approve").onclick = () => decide(true);
      $("deny").onclick = () => decide(false);
    }

    main().catch((e) => { status("Something went wrong"); fail(String(e?.message ?? e)); });
  </script>
</body>
</html>
